# 안드로이드 앱 빌드 (Actions 탭 → "Android app" → Run workflow)
# 결과물: 테스트용 APK (디버그 서명) · Play 업로드용 AAB (업로드 키 서명, 비밀값이 있을 때)
#
# 필요한 저장소 비밀값 (Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_BASE64   업로드 키 파일을 base64 로 바꾼 값
#   ANDROID_KEYSTORE_PASSWORD 키 저장소 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭 (기존 앱: leelmell)
#   ANDROID_KEY_PASSWORD      키 비밀번호
name: Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: WEB_VERSION="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" npm run build
      - run: npx cap sync android

      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::업로드 키 비밀값이 없어 Play 업로드용 AAB 는 서명되지 않습니다"
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: leelmell-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: leelmell-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - run: rm -f "$RUNNER_TEMP/upload.keystore"
        if: always()
